name: Testar OmniCloak no macOS Real

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  test-mac:
    runs-on: macos-latest
    steps:
      - name: 1. Baixar pacote OmniCloak macOS (v1.2.5)
        run: |
          echo "Baixando release oficial..."
          curl -fsSL -o OmniCloak.zip "https://gammacharts.online/gex/downloads/OmniCloak-Mac-AppleSilicon.zip"
          unzip -q OmniCloak.zip
          echo "Extração concluída."

      - name: 2. Restaurar permissões Unix e assinar para Apple Silicon
        run: |
          chmod -R +x OmniCloak.app
          xattr -cr OmniCloak.app
          rm -f "OmniCloak.app/Contents/Resources/default_app.asar"
          /usr/libexec/PlistBuddy -c "Delete :ElectronAsarIntegrity" "OmniCloak.app/Contents/Info.plist" 2>/dev/null || true
          codesign --force --deep --sign - "OmniCloak.app"
          echo "✅ Pacote pronto para execução no Mac."

      - name: 3. Iniciar OmniCloak com depurador ativo
        run: |
          echo "Iniciando OmniCloak no macOS com porta de automação..."
          ./OmniCloak.app/Contents/MacOS/OmniCloak --remote-debugging-port=9222 > omnicloak.log 2>&1 &
          APP_PID=$!
          echo "Processo rodando com PID $APP_PID"
          sleep 4

      - name: 4. Bateria Completa com Espera Estendida (35s por Perfil)
        run: |
          npm install ws
          node << 'EOF'
          const http = require('http');
          const WebSocket = require('ws');
          const { execSync } = require('child_process');

          async function run() {
            let target = null;
            for (let i = 0; i < 20; i++) {
              await new Promise(r => setTimeout(r, 500));
              try {
                const res = await new Promise((resolve, reject) => {
                  http.get('http://127.0.0.1:9222/json', (res) => {
                    let d = '';
                    res.on('data', c => d += c);
                    res.on('end', () => resolve(JSON.parse(d)));
                  }).on('error', reject);
                });
                target = res.find(t => t.type === 'page');
                if (target && target.webSocketDebuggerUrl) break;
              } catch(e) {}
            }

            if (!target) throw new Error("Janela do OmniCloak não encontrada na porta 9222");
            console.log("Conectado à interface do OmniCloak!");

            const ws = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise(r => ws.on('open', r));

            function exec(code) {
              return new Promise(resolve => {
                const id = Math.floor(Math.random() * 100000);
                const onMsg = (data) => {
                  const m = JSON.parse(data);
                  if (m.id === id) {
                    ws.off('message', onMsg);
                    const val = (m.result && m.result.result) ? m.result.result.value : (m.result ? m.result.value : null);
                    resolve(val);
                  }
                };
                ws.on('message', onMsg);
                ws.send(JSON.stringify({ id, method: "Runtime.evaluate", params: { expression: code, returnByValue: true } }));
              });
            }

            console.log("1. Efetuando login...");
            await exec(`
              document.querySelector('#username').value = 'teste2910029200';
              document.querySelector('#password').value = 'jVz8boBk';
              document.querySelector('#loginForm').requestSubmit();
            `);

            console.log("2. Aguardando 7s para carregar a tabela de perfis da VPS...");
            await new Promise(r => setTimeout(r, 7000));

            // Executa os 4 perfis em sequência
            const perfis = [0, 1, 2, 3];
            for (const idx of perfis) {
              const profName = await exec(`
                const rows = document.querySelectorAll('#profilesTableBody tr');
                rows[${idx}] ? rows[${idx}].querySelector('.profile-name').innerText.trim() : 'Perfil_${idx+1}'
              `) || `Perfil_${idx+1}`;

              const safeName = profName.replace(/[^a-zA-Z0-9_]/g, '_');

              console.log(`\n======================================================`);
              console.log(`▶ [${idx+1}/4] INICIANDO: ${profName}`);
              console.log(`======================================================`);

              console.log(`- Clicando no botão Iniciar da linha ${idx+1}...`);
              await exec(`
                const rows = document.querySelectorAll('#profilesTableBody tr');
                if (rows && rows[${idx}]) {
                  const btn = rows[${idx}].querySelector('.btn-launch');
                  if (btn) btn.click();
                }
              `);

              console.log(`- Aguardando 35 segundos para cookies, túnel e gráficos carregarem...`);
              await new Promise(r => setTimeout(r, 35000));

              console.log(`- Tirando screenshot: perfil_${idx+1}_${safeName}.png`);
              execSync(`screencapture -x "perfil_${idx+1}_${safeName}.png"`);

              console.log(`- Fechando navegador do perfil...`);
              await exec(`
                const rows = document.querySelectorAll('#profilesTableBody tr');
                if (rows && rows[${idx}]) {
                  const stop = rows[${idx}].querySelector('.btn-stop');
                  if (stop) stop.click();
                }
              `);
              try { execSync(`killall "Google Chrome" 2>/dev/null || true`); } catch(e) {}

              console.log(`- Aguardando 6 segundos antes de abrir o próximo...`);
              await new Promise(r => setTimeout(r, 6000));
            }

            ws.close();
            console.log("\n🎉 Bateria de testes nos 4 perfis concluída com sucesso!");
          }

          run().catch(err => { console.error("Erro na automação:", err); process.exit(1); });
          EOF

      - name: 5. Salvar Artefatos dos 4 Perfis
        uses: actions/upload-artifact@v4
        with:
          name: teste-4-perfis-mac
          path: |
            *.png
            omnicloak.log
          retention-days: 1
