name: Testar OmniCloak no macOS Real

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  test-mac:
    runs-on: macos-latest
    steps:
      - name: 1. Baixar pacote OmniCloak macOS (v1.2.5)
        run: |
          echo "Baixando release oficial..."
          curl -fsSL -o OmniCloak.zip "https://gammacharts.online/gex/downloads/OmniCloak-Mac-AppleSilicon.zip"
          unzip -q OmniCloak.zip
          echo "Extração concluída."

      - name: 2. Ajustar integridade e assinar para Apple Silicon
        run: |
          # 1. Remove quarentena
          xattr -cr OmniCloak.app

          # 2. Remove default_app.asar legada se existir
          rm -f "OmniCloak.app/Contents/Resources/default_app.asar"

          # 3. Remove trava ElectronAsarIntegrity do Info.plist se existir
          /usr/libexec/PlistBuddy -c "Delete :ElectronAsarIntegrity" "OmniCloak.app/Contents/Info.plist" 2>/dev/null || true

          # 4. Assina o pacote localmente para Apple Silicon (ad-hoc)
          codesign --force --deep --sign - "OmniCloak.app"
          echo "✅ Pacote assinado e validado com sucesso para Apple Silicon!"

      - name: 3. Executar OmniCloak com captura de logs
        run: |
          echo "Iniciando OmniCloak no macOS..."
          
          # Inicia capturando saída de erros e terminal
          ./OmniCloak.app/Contents/MacOS/OmniCloak > omnicloak.log 2>&1 &
          APP_PID=$!
          echo "Processo iniciado com PID: $APP_PID"

          # Aguarda 10 segundos
          sleep 10

          echo "Status dos processos do OmniCloak:"
          ps aux | grep OmniCloak || true

          echo "Últimos logs do aplicativo:"
          cat omnicloak.log || true

          echo "Tirando screenshot da tela..."
          screencapture -x screenshot_mac.png

      - name: 4. Salvar Relatório e Print (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: resultado-teste-mac
          path: |
            screenshot_mac.png
            omnicloak.log
          retention-days: 1
