name: Testar OmniCloak no macOS Real (Todos os 4 Perfis)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  test-mac-all-4:
    runs-on: macos-latest
    steps:
      - name: 1. Baixar pacote OmniCloak macOS Oficial (v1.2.8)
        run: |
          echo "Baixando release oficial..."
          curl -fsSL -o OmniCloak.zip "https://gammacharts.online/gex/downloads/OmniCloak-Mac-AppleSilicon.zip"
          unzip -q OmniCloak.zip
          echo "Extração concluída."

      - name: 2. Restaurar permissões Unix e desativar primeiro uso do Chrome
        run: |
          chmod -R +x OmniCloak.app
          xattr -cr OmniCloak.app
          rm -f "OmniCloak.app/Contents/Resources/default_app.asar"
          /usr/libexec/PlistBuddy -c "Delete :ElectronAsarIntegrity" "OmniCloak.app/Contents/Info.plist" 2>/dev/null || true
          codesign --force --deep --sign - "OmniCloak.app"
          
          # Desativa o popup "Welcome to Google Chrome" no macOS
          mkdir -p "$HOME/Library/Application Support/Google/Chrome"
          touch "$HOME/Library/Application Support/Google/Chrome/First Run"
          echo "✅ Pacote pronto para execução no Mac."

      - name: 3. Iniciar OmniCloak com depurador ativo
        run: |
          echo "Iniciando OmniCloak no macOS..."
          ./OmniCloak.app/Contents/MacOS/OmniCloak --remote-debugging-port=9222 > omnicloak.log 2>&1 &
          APP_PID=$!
          echo "Processo rodando com PID $APP_PID"
          sleep 4

      - name: 4. Automação dos 4 Perfis em Sequência por Serial Fixo
        run: |
          npm install ws
          node << 'EOF'
          const http = require('http');
          const WebSocket = require('ws');
          const { execSync } = require('child_process');

          async function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
          }

          async function run() {
            let target = null;
            for (let i = 0; i < 20; i++) {
              await sleep(500);
              try {
                const res = await new Promise((resolve, reject) => {
                  http.get('http://127.0.0.1:9222/json', (res) => {
                    let d = '';
                    res.on('data', c => d += c);
                    res.on('end', () => resolve(JSON.parse(d)));
                  }).on('error', reject);
                });
                target = res.find(t => t.type === 'page');
                if (target && target.webSocketDebuggerUrl) break;
              } catch(e) {}
            }

            if (!target) throw new Error("Janela do OmniCloak não encontrada na porta 9222");
            console.log("Conectado à interface do OmniCloak!");

            const ws = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise(r => ws.on('open', r));

            function exec(code) {
              return new Promise(resolve => {
                const id = Math.floor(Math.random() * 100000);
                const onMsg = (data) => {
                  const m = JSON.parse(data);
                  if (m.id === id) {
                    ws.off('message', onMsg);
                    resolve(m.result ? m.result.value : null);
                  }
                };
                ws.on('message', onMsg);
                ws.send(JSON.stringify({ id, method: "Runtime.evaluate", params: { expression: code } }));
              });
            }

            console.log(">>> Efetuando login no OmniCloak...");
            await exec(`
              document.querySelector('#username').value = 'teste2910029200';
              document.querySelector('#password').value = 'jVz8boBk';
              document.querySelector('#loginForm').requestSubmit();
            `);

            console.log(">>> Aguardando 7s para carregar a tabela com os 4 perfis...");
            await sleep(7000);

            // Mapeamento exato de cada perfil pelo serial fixo
            const profiles = [
              { serial: 4, name: "1_FINANCIAL_JUICE", waitSec: 35 },
              { serial: 3, name: "2_MENTHORQ", waitSec: 35 },
              { serial: 1, name: "3_QUANTDATA", waitSec: 35 },
              { serial: 2, name: "4_SPOTGAMMA", waitSec: 42 }
            ];

            for (const p of profiles) {
              console.log(`\n========================================`);
              console.log(`>>> [INICIANDO] Perfil: ${p.name} (Serial ${p.serial})`);
              console.log(`========================================`);

              // 1. Inicia o perfil via função interna da aplicação
              await exec(`window.launchProfile(${p.serial})`);

              // 2. Aguarda abertura do Chrome, injeção de cookies e renderização
              console.log(`>>> Aguardando ${p.waitSec}s para carregamento completo...`);
              await sleep(p.waitSec * 1000);

              // 3. Força o Chrome para o Primeiro Plano Total
              try {
                execSync(`osascript -e 'tell application "Google Chrome" to activate'`);
                await sleep(2000);
              } catch(e) {}

              // 4. Captura a tela com a página logada e ativa
              console.log(`>>> Capturando print: ${p.name}.png`);
              execSync(`screencapture -x "${p.name}.png"`);

              // 5. Encerra limpo pelo próprio OmniCloak
              console.log(`>>> Fechando perfil ${p.name} pelo OmniCloak...`);
              await exec(`window.closeProfile(${p.serial})`);
              await sleep(4000);
            }

            ws.close();
            console.log("\n✅ Teste dos 4 perfis finalizado com sucesso!");
          }

          run().catch(err => { console.error("Erro na automação:", err); process.exit(1); });
          EOF

      - name: 5. Exibir logs finais
        run: |
          echo "=== LOGS OMNICLOAK ==="
          cat omnicloak.log || true

      - name: 6. Salvar Artefatos dos 4 Perfis
        uses: actions/upload-artifact@v4
        with:
          name: resultado-todos-4-perfis-mac
          path: |
            1_FINANCIAL_JUICE.png
            2_MENTHORQ.png
            3_QUANTDATA.png
            4_SPOTGAMMA.png
            omnicloak.log
          retention-days: 2
