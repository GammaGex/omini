name: Build and Package OmniCloak macOS (Apple Silicon & Intel)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-14  # Apple Silicon runner com suporte para cross-compile x64
    
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Descompactar arquivos do projeto se enviados em ZIP
        run: |
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Descompactando $f..."
              unzip -o "$f" || true
            fi
          done

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        run: |
          npm install

      - name: Ofuscar Código de Produção
        run: |
          node obfuscate.js

      - name: Compilar OmniCloak Apple Silicon (M1-M4 ARM64)
        run: |
          npx electron-builder --mac dmg zip --arm64 \
            --publish never \
            -c.mac.identity=null \
            -c.mac.category=public.app-category.developer-tools \
            -c.mac.artifactName='OmniCloak-Mac-AppleSilicon.${ext}'

      - name: Compilar OmniCloak Mac Intel (x64)
        run: |
          npx electron-builder --mac dmg zip --x64 \
            --publish never \
            -c.mac.identity=null \
            -c.mac.category=public.app-category.developer-tools \
            -c.mac.artifactName='OmniCloak-Mac-Intel.${ext}'

      - name: Teste 1 — Validar Info.plist
        run: |
          echo "=== Verificando Info.plist ARM64 ==="
          plutil -lint "dist/mac-arm64/OmniCloak.app/Contents/Info.plist"
          echo "=== Verificando Info.plist Intel x64 ==="
          plutil -lint "dist/mac/OmniCloak.app/Contents/Info.plist"

      - name: Teste 2 — Validar Arquiteturas
        run: |
          echo "=== Verificando arquitetura ARM64 ==="
          lipo -archs "dist/mac-arm64/OmniCloak.app/Contents/MacOS/OmniCloak"
          echo "=== Verificando arquitetura Intel x64 ==="
          lipo -archs "dist/mac/OmniCloak.app/Contents/MacOS/OmniCloak"

      - name: Teste 3 — Validar Assinaturas Ad-Hoc
        run: |
          codesign -dv --verbose=4 "dist/mac-arm64/OmniCloak.app" || true
          codesign -dv --verbose=4 "dist/mac/OmniCloak.app" || true

      - name: Teste 4 — Validar e Montar os DMGs com hdiutil
        run: |
          echo "=== Testando montagem do DMG Apple Silicon ==="
          hdiutil attach dist/OmniCloak-Mac-AppleSilicon.dmg -mountpoint /Volumes/MountArm -nobrowse
          test -d /Volumes/MountArm/OmniCloak.app
          test -L /Volumes/MountArm/Applications
          hdiutil detach /Volumes/MountArm

          echo "=== Testando montagem do DMG Intel ==="
          hdiutil attach dist/OmniCloak-Mac-Intel.dmg -mountpoint /Volumes/MountIntel -nobrowse
          test -d /Volumes/MountIntel/OmniCloak.app
          test -L /Volumes/MountIntel/Applications
          hdiutil detach /Volumes/MountIntel

      - name: Gerar Checksums SHA-256
        run: |
          cd dist
          shasum -a 256 OmniCloak-Mac-*.dmg OmniCloak-Mac-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publicar Artefatos Gerados (DMG e ZIP para ambos)
        uses: actions/upload-artifact@v4
        with:
          name: OmniCloak-macOS-Universal
          path: |
            dist/OmniCloak-Mac-AppleSilicon.dmg
            dist/OmniCloak-Mac-AppleSilicon.zip
            dist/OmniCloak-Mac-Intel.dmg
            dist/OmniCloak-Mac-Intel.zip
            dist/SHA256SUMS.txt
