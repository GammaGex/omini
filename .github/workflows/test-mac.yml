name: Build and Package OmniCloak macOS (Apple Silicon ARM64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Apple Silicon (ARM64)
    runs-on: macos-15  # Apple Silicon M-series nativo do GitHub Actions
    
    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        run: |
          npm install

      - name: Ofuscar Código de Produção
        run: |
          node obfuscate.js

      - name: Compilar e Empacotar OmniCloak (DMG e ZIP ARM64)
        run: |
          # Gera o DMG UDIF/UDZO nativo e o ZIP preservando links simbólicos e permissões
          # -c.mac.identity=null garante assinatura ad-hoc limpa sem exigir certificado Apple Developer
          npx electron-builder --mac dmg zip --arm64 \
            -c.mac.identity=null \
            -c.mac.category=public.app-category.developer-tools \
            -c.mac.artifactName="OmniCloak-Mac-AppleSilicon.${ext}"

      - name: Teste 1 — Validar Info.plist
        run: |
          APP_PATH="dist/mac-arm64/OmniCloak.app"
          echo "=== Verificando integridade estrutural do Info.plist ==="
          plutil -lint "$APP_PATH/Contents/Info.plist"

      - name: Teste 2 — Validar Arquitetura ARM64
        run: |
          APP_PATH="dist/mac-arm64/OmniCloak.app"
          echo "=== Verificando arquitetura dos binários ==="
          ARCH=$(lipo -archs "$APP_PATH/Contents/MacOS/OmniCloak")
          echo "Arquitetura detectada: $ARCH"
          if [[ "$ARCH" != *"arm64"* ]]; then
            echo "ERRO: O binário não é arm64!"
            exit 1
          fi

      - name: Teste 3 — Validar Assinatura Ad-Hoc e Integridade do Bundle
        run: |
          APP_PATH="dist/mac-arm64/OmniCloak.app"
          echo "=== Informações detalhadas da assinatura ad-hoc ==="
          codesign -dv --verbose=4 "$APP_PATH"
          echo "=== Verificação estrita de integridade do pacote e selo ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Teste 4 — Validar e Montar o DMG Nativo com hdiutil
        run: |
          DMG_PATH=$(find dist -name "*.dmg" | head -n 1)
          echo "=== Verificando formato da imagem UDIF/UDZO com hdiutil ==="
          hdiutil imageinfo "$DMG_PATH" | grep -E "(Format|File format|Total Bytes)"
          
          echo "=== Montando DMG para teste no macOS ==="
          MOUNT_DIR="/Volumes/OmniCloakTest"
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_DIR" -nobrowse
          
          echo "=== Validando conteúdo do volume montado ==="
          ls -la "$MOUNT_DIR"
          
          # Verificar existência do aplicativo
          if [ ! -d "$MOUNT_DIR/OmniCloak.app" ]; then
            echo "ERRO: OmniCloak.app não encontrado dentro do DMG!"
            hdiutil detach "$MOUNT_DIR"
            exit 1
          fi
          
          # Verificar atalho simbólico para /Applications
          if [ ! -L "$MOUNT_DIR/Applications" ]; then
            echo "ERRO: Atalho para Applications ausente ou inválido!"
            hdiutil detach "$MOUNT_DIR"
            exit 1
          fi
          
          echo "=== Testando simulação de instalação em /Applications ==="
          rm -rf /tmp/TestApplications && mkdir -p /tmp/TestApplications
          cp -R "$MOUNT_DIR/OmniCloak.app" /tmp/TestApplications/
          
          echo "=== Validando caminho final simulado ==="
          test -d /tmp/TestApplications/OmniCloak.app
          echo "Caminho validado: /tmp/TestApplications/OmniCloak.app"
          
          echo "=== Testando execução de remoção de quarentena (xattr -cr) ==="
          xattr -cr /tmp/TestApplications/OmniCloak.app
          echo "xattr -cr executado com sucesso!"
          
          echo "=== Desmontando imagem DMG ==="
          hdiutil detach "$MOUNT_DIR"

      - name: Gerar Checksums SHA-256
        run: |
          cd dist
          shasum -a 256 OmniCloak-Mac-AppleSilicon.dmg OmniCloak-Mac-AppleSilicon.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publicar Artefatos Gerados (DMG e ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: OmniCloak-macOS-AppleSilicon
          path: |
            dist/OmniCloak-Mac-AppleSilicon.dmg
            dist/OmniCloak-Mac-AppleSilicon.zip
            dist/SHA256SUMS.txt
            
